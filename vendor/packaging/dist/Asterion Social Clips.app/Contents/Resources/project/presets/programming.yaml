# Estilo para clips de contenido técnico/programación: más chico y más
# líneas por bloque, porque el vocabulario (nombres de función, términos
# en inglés mezclados) necesita más ancho para no cortarse feo.
font: "Menlo"
font_size: 52
primary_color: "&H0000FF00"   # verde terminal
outline_color: "&H00000000"
outline_width: 3
position: bottom
margin_v: 140
max_chars_per_line: 34
